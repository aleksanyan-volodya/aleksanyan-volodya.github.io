name: Deploy site

on:
  schedule:
    - cron: "0 6 * * *" # runs daily at 6am UTC to refresh Letterboxd data
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "_sass/**"
      - "_scripts/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
      - "!CONTRIBUTING.md"
      - "!CUSTOMIZE.md"
      - "!FAQ.md"
      - "!INSTALL.md"
      - "!README.md"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "_sass/**"
      - "_scripts/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
      - "!CONTRIBUTING.md"
      - "!CUSTOMIZE.md"
      - "!FAQ.md"
      - "!INSTALL.md"
      - "!README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip" # caching pip dependencies
      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          propertyPath: "giscus.repo"
          value: ${{ github.repository }}
      - name: Fetch Letterboxd data 🎬
        run: |
          python3 << 'EOF'
          import urllib.request, json, xml.etree.ElementTree as ET, re, sys
          try:
            req = urllib.request.Request('https://letterboxd.com/_volodya_/rss/', headers={'User-Agent': 'Mozilla/5.0'})
            xml_content = urllib.request.urlopen(req, timeout=15).read().decode()
            root = ET.fromstring(xml_content)
            films, seen = [], set()
            for item in root.findall('.//item'):
              t = item.find('{https://letterboxd.com}filmTitle')
              if t is None or t.text in seen: continue
              seen.add(t.text)
              y = item.find('{https://letterboxd.com}filmYear')
              r = item.find('{https://letterboxd.com}memberRating')
              l = item.find('link')
              d = item.find('description')
              poster = ''
              if d is not None and d.text:
                m = re.search(r'src="(https://a\.ltrbxd\.com[^"]+)"', d.text)
                if m: poster = m.group(1)
              rating = float(r.text) if r is not None else None
              stars = (('★' * int(rating)) + ('½' if rating and rating % 1 >= 0.5 else '')) if rating else ''
              link_text = l.text.strip() if l is not None and l.text else ''
              films.append({'title': t.text, 'year': y.text if y is not None else '', 'stars': stars, 'link': link_text, 'poster': poster})
              if len(films) >= 5: break
            json.dump(films, open('_data/letterboxd.json', 'w'), indent=2)
            print(f'Fetched {len(films)} films from Letterboxd')
          except Exception as e:
            print(f'Warning: could not fetch Letterboxd: {e}', file=sys.stderr)
            json.dump([], open('_data/letterboxd.json', 'w'))
          EOF
      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Deploy 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
